<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
  <title>Sassy Brain</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b; --surface: #18181b; --surface2: #27272a; --surface3: #3f3f46;
      --border: #3f3f46; --text: #fafafa; --text2: #a1a1aa; --text3: #71717a;
      --accent: #f97316; --accent2: #ea580c; --green: #22c55e; --red: #ef4444;
      --blue: #3b82f6; --purple: #a855f7; --consensus: #22c55e; --radius: 12px;
      --font: 'Inter', -apple-system, sans-serif; --mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Top bar ─── */
    .topbar {
      height: 44px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; -webkit-app-region: drag; flex-shrink: 0; gap: 10px;
    }
    .topbar-logo { font-family: var(--mono); font-weight: 700; font-size: 14px; background: linear-gradient(135deg, var(--accent), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .topbar-mode { -webkit-app-region: no-drag; display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 2px; }
    .mode-btn { padding: 4px 10px; border: none; background: transparent; color: var(--text2); font-size: 10px; font-weight: 600; border-radius: 6px; cursor: pointer; font-family: var(--mono); transition: all 0.2s; white-space: nowrap; }
    .mode-btn.active { background: var(--surface2); color: var(--text); }
    .mode-btn:hover:not(.active) { color: var(--text); }
    .topbar-spacer { flex: 1; }
    .topbar-btn { -webkit-app-region: no-drag; background: none; border: none; color: var(--text2); cursor: pointer; font-size: 16px; padding: 4px 8px; transition: color 0.2s; }
    .topbar-btn:hover { color: var(--text); }

    /* ── Status bar ─── */
    .statusbar {
      height: 28px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 16px; flex-shrink: 0; overflow-x: auto;
    }
    .status-item { display: flex; align-items: center; gap: 5px; font-size: 10px; font-family: var(--mono); color: var(--text3); white-space: nowrap; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* ── Chat area ─── */
    .chat-container { flex: 1; overflow-y: auto; padding: 20px 24px; scroll-behavior: smooth; }
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

    .msg { margin-bottom: 16px; max-width: 85%; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .msg-user { margin-left: auto; }
    .msg-ai { margin-right: auto; }
    .msg-system { margin: 0 auto; text-align: center; }

    .msg-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 10px; font-family: var(--mono); color: var(--text3); }
    .msg-provider-dot { width: 6px; height: 6px; border-radius: 50%; }

    .msg-bubble {
      padding: 12px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.6;
      word-wrap: break-word; overflow-wrap: break-word;
    }
    .msg-user .msg-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
    .msg-ai .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg-system .msg-bubble { background: transparent; color: var(--text3); font-size: 12px; font-family: var(--mono); }
    .msg-bubble code { background: rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
    .msg-bubble pre { background: var(--bg); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
    .msg-bubble pre code { background: none; padding: 0; font-size: 12px; }

    /* ── Debate panel ─── */
    .debate-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 16px; overflow: hidden;
    }
    .debate-header {
      display: flex; align-items: center; gap: 8px; padding: 8px 14px;
      background: var(--bg); font-size: 11px; font-family: var(--mono); color: var(--text2);
      border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .debate-header:hover { color: var(--text); }
    .debate-body { display: flex; gap: 1px; background: var(--border); max-height: 200px; transition: max-height 0.3s; overflow: hidden; }
    .debate-body.collapsed { max-height: 0; }
    .debate-col { flex: 1; background: var(--surface); padding: 10px; overflow-y: auto; }
    .debate-col-header { font-size: 10px; font-family: var(--mono); font-weight: 600; margin-bottom: 6px; }
    .debate-col-text { font-size: 11px; color: var(--text2); line-height: 1.5; white-space: pre-wrap; }

    /* ── Queue ─── */
    .queue-area { padding: 0 24px; }
    .queue-item { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--surface); border-radius: 6px; margin-bottom: 4px; font-size: 11px; }
    .queue-badge { font-family: var(--mono); color: var(--accent); font-weight: 600; font-size: 10px; }
    .queue-text { flex: 1; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-remove { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 12px; }

    /* ── Input area ─── */
    .input-area {
      padding: 12px 24px 16px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    textarea {
      flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 14px; color: var(--text); font-family: var(--font); font-size: 14px;
      resize: none; outline: none; min-height: 42px; max-height: 200px; line-height: 1.5;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--text3); }

    .send-group { display: flex; gap: 2px; }
    .btn-send {
      padding: 10px 20px; background: var(--accent); border: none; border-radius: 10px 0 0 10px;
      color: white; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .btn-send:hover { background: var(--accent2); }
    .btn-dropdown {
      padding: 10px 8px; background: var(--accent); border: none; border-radius: 0 10px 10px 0;
      color: white; cursor: pointer; font-size: 10px; border-left: 1px solid rgba(255,255,255,0.2);
    }
    .dropdown-menu {
      display: none; position: absolute; bottom: 100%; right: 0; margin-bottom: 4px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; min-width: 140px; z-index: 100;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 8px 14px; font-size: 12px; cursor: pointer; transition: background 0.1s;
      font-family: var(--mono); color: var(--text2);
    }
    .dropdown-item:hover { background: var(--surface2); color: var(--text); }
    .send-group { position: relative; }

    /* ── Settings overlay ─── */
    .settings-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center;
    }
    .settings-overlay.show { display: flex; }
    .settings-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 28px; width: 480px; max-height: 80vh; overflow-y: auto;
    }
    .settings-title { font-family: var(--mono); font-size: 16px; font-weight: 700; margin-bottom: 20px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .setting-label { font-size: 13px; color: var(--text2); }
    .setting-value select, .setting-value input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 8px; color: var(--text); font-family: var(--mono); font-size: 12px; outline: none;
    }
    .settings-close {
      margin-top: 16px; width: 100%; padding: 10px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      cursor: pointer; font-weight: 600; font-size: 13px;
    }

    /* ── Consensus provider picker ─── */
    .consensus-picker { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .cp-chip {
      display: flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px;
      font-size: 10px; font-family: var(--mono); font-weight: 600; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg); color: var(--text2); transition: all 0.2s;
    }
    .cp-chip.selected { border-color: var(--green); color: var(--green); background: rgba(34,197,94,0.1); }
    .cp-chip.disabled { opacity: 0.3; cursor: not-allowed; }
    .cp-dot { width: 6px; height: 6px; border-radius: 50%; }

    .streaming-cursor { display: inline-block; width: 2px; height: 14px; background: var(--accent); animation: blink 0.8s infinite; vertical-align: middle; margin-left: 2px; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    /* ── View tabs + panels (Mesh / Dashboard / Phone / Actions) ─── */
    .view-tabs { -webkit-app-region: no-drag; display: flex; gap: 2px; margin-left: 4px; }
    .view-tab { padding: 4px 10px; border: none; background: transparent; color: var(--text2); font-size: 10px; font-weight: 600; border-radius: 6px; cursor: pointer; font-family: var(--mono); transition: all .15s; white-space: nowrap; }
    .view-tab.active { background: var(--surface2); color: var(--accent); }
    .view-tab:hover:not(.active) { color: var(--text); }
    .view-panel { flex: 1; overflow-y: auto; padding: 20px 24px; display: none; }
    .view-panel.active { display: block; }
    .vp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .vp-title { font-family: var(--mono); font-size: 13px; color: var(--accent); }
    .vp-refresh { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); border-radius: 6px; padding: 3px 9px; font-size: 10px; cursor: pointer; font-family: var(--mono); }
    .vp-refresh:hover { color: var(--text); }
    .vp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .vp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .vp-card h3 { font-family: var(--mono); font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .vp-empty { color: var(--text3); font-size: 12px; padding: 6px 0; }
    .peer { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .peer-top { display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot.g { background: var(--green); } .dot.x { background: var(--text3); }
    .peer-name { font-weight: 600; font-size: 13px; flex: 1; }
    .peer-plat { font-size: 10px; color: var(--text3); font-family: var(--mono); }
    .caps { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
    .cap { font-size: 9px; font-family: var(--mono); background: var(--surface2); color: var(--text2); padding: 1px 6px; border-radius: 10px; }
    .cap.dim { opacity: .5; }
    .peer-foot { font-size: 10px; color: var(--text3); font-family: var(--mono); }
    .stat-v { font-size: 22px; font-weight: 700; color: var(--text); }
    .stat-v.accent { color: var(--accent); }
    .stat-s { font-size: 11px; color: var(--text3); }
    .chrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; font-family: var(--mono); }
    .chrow .bar { flex: 1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .chrow .bar i { display: block; height: 100%; background: var(--accent); }
    .vp-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
    .vp-act { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; cursor: pointer; color: var(--text); font: inherit; }
    .vp-act:hover { border-color: var(--accent); }
    .vp-act b { font-size: 13px; font-weight: 600; }
    .vp-act span { font-size: 11px; color: var(--text3); }
  </style>
</head>
<body>
  <!-- Top bar -->
  <div class="topbar">
    <span class="topbar-logo">SASSY BRAIN</span>
    <div class="view-tabs" id="view-tabs">
      <button class="view-tab active" data-view="chat" onclick="switchView('chat')">Chat</button>
      <button class="view-tab" data-view="mesh" onclick="switchView('mesh')">Mesh</button>
      <button class="view-tab" data-view="dashboard" onclick="switchView('dashboard')">Dashboard</button>
      <button class="view-tab" data-view="phone" onclick="switchView('phone')">Phone</button>
      <button class="view-tab" data-view="actions" onclick="switchView('actions')">Actions</button>
    </div>
    <div class="topbar-mode" id="mode-bar"></div>
    <span class="topbar-spacer"></span>
    <button class="topbar-btn" onclick="newChat()" title="New Chat">+</button>
    <button class="topbar-btn" onclick="toggleSettings()" title="Settings">⚙</button>
    <button class="topbar-btn" onclick="window.sassy.nav.toSetup()" title="API Keys">🔑</button>
  </div>

  <!-- Status bar -->
  <div class="statusbar" id="status-bar"></div>

  <!-- Chat -->
  <div class="chat-container" id="chat-area"></div>

  <!-- Mesh / Dashboard / Phone / Actions panels -->
  <div class="view-panel" id="panel-mesh"></div>
  <div class="view-panel" id="panel-dashboard"></div>
  <div class="view-panel" id="panel-phone"></div>
  <div class="view-panel" id="panel-actions"></div>

  <!-- Queue -->
  <div class="queue-area" id="queue-area"></div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Ask anything..." oninput="autoResize(this)"></textarea>
      <div class="send-group">
        <button class="btn-send" id="btn-send" onclick="handleSend()">Send</button>
        <button class="btn-dropdown" id="btn-dropdown" onclick="toggleDropdown()">▾</button>
        <div class="dropdown-menu" id="dropdown-menu">
          <div class="dropdown-item" onclick="setSendMode('send'); closeDropdown()">Send (new message)</div>
          <div class="dropdown-item" onclick="setSendMode('steer'); closeDropdown()">Steer (redirect)</div>
          <div class="dropdown-item" onclick="setSendMode('stop'); closeDropdown()">Stop & Send</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings overlay -->
  <div class="settings-overlay" id="settings-overlay" onclick="if(event.target===this)toggleSettings()">
    <div class="settings-panel">
      <div class="settings-title">Settings</div>
      <div id="settings-content"></div>
      <button class="settings-close" onclick="toggleSettings()">Close</button>
    </div>
  </div>

<script>
// ── State ──────────────────────────────────────────────────────
let providers = {};
let availableProviders = []; // providers with keys
let currentMode = 'consensus'; // consensus | single provider id
let singleProvider = null;
let chatHistory = [];
let streamBuffers = {};
let activeSignals = new Set();
let isStreaming = false;
let signalCounter = 0;
let messageQueue = [];
let sendMode = 'send';
let consensusProviders = [];

const PROVIDER_COLORS = {};

// ── Init ───────────────────────────────────────────────────────
async function init() {
  providers = await window.sassy.providers.list();
  const hasKeys = await window.sassy.keys.has();
  const prefs = await window.sassy.prefs.get();

  // Build available providers list
  availableProviders = Object.keys(providers).filter(p => hasKeys[p]);

  // Store colors
  for (const [id, p] of Object.entries(providers)) PROVIDER_COLORS[id] = p.color;
  PROVIDER_COLORS.consensus = '#22c55e';

  // Load consensus provider preferences
  consensusProviders = prefs.consensusProviders || [];
  // Filter to only available providers
  consensusProviders = consensusProviders.filter(p => availableProviders.includes(p));
  // Default: pick first 2 available
  if (consensusProviders.length < 2 && availableProviders.length >= 2) {
    consensusProviders = availableProviders.slice(0, 2);
    await window.sassy.prefs.set('consensusProviders', consensusProviders);
  }

  // Set default mode
  if (availableProviders.length >= 2) {
    currentMode = 'consensus';
  } else if (availableProviders.length === 1) {
    currentMode = availableProviders[0];
    singleProvider = availableProviders[0];
  }

  buildModeBar();
  buildStatusBar();
  buildSettings();
  setupListeners();

  addSystemMessage(`Sassy Brain v0.3.1 — ${availableProviders.length} provider${availableProviders.length !== 1 ? 's' : ''} active`);
}

function buildModeBar() {
  const bar = document.getElementById('mode-bar');
  let html = '';

  // Consensus button (only if 2+ providers)
  if (availableProviders.length >= 2) {
    html += `<button class="mode-btn ${currentMode === 'consensus' ? 'active' : ''}" onclick="switchMode('consensus')">⚡ Consensus</button>`;
  }

  // Individual provider buttons
  for (const id of availableProviders) {
    const active = currentMode === id ? 'active' : '';
    html += `<button class="mode-btn ${active}" onclick="switchMode('${id}')" style="${currentMode === id ? `color:${PROVIDER_COLORS[id]}` : ''}">${providers[id].name}</button>`;
  }

  bar.innerHTML = html;
}

function buildStatusBar() {
  const bar = document.getElementById('status-bar');
  let html = '';
  for (const id of availableProviders) {
    html += `<div class="status-item"><div class="status-dot" style="background:${PROVIDER_COLORS[id]}"></div><span>${providers[id].name}</span><span id="status-${id}-text" style="color:var(--text3)">idle</span></div>`;
  }
  bar.innerHTML = html;
}

function buildSettings() {
  const container = document.getElementById('settings-content');
  let html = '';

  // Model selectors for each provider
  for (const id of availableProviders) {
    const p = providers[id];
    html += `<div class="setting-row"><span class="setting-label">${p.name} Model</span><div class="setting-value"><select onchange="savePref('${id}Model', this.value)">`;
    for (const m of p.models) {
      html += `<option value="${m}">${m.split('/').pop()}</option>`;
    }
    html += `</select></div></div>`;
  }

  // Consensus turns
  html += `<div class="setting-row"><span class="setting-label">Consensus Rounds</span><div class="setting-value"><select onchange="savePref('consensusTurns', parseInt(this.value))"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></div></div>`;

  // Consensus provider picker
  if (availableProviders.length >= 2) {
    html += `<div class="setting-row" style="flex-direction:column;align-items:flex-start"><span class="setting-label">Consensus Participants (pick 2+)</span><div class="consensus-picker" id="consensus-picker">`;
    for (const id of availableProviders) {
      const selected = consensusProviders.includes(id) ? 'selected' : '';
      html += `<div class="cp-chip ${selected}" data-provider="${id}" onclick="toggleConsensusProvider('${id}')"><div class="cp-dot" style="background:${PROVIDER_COLORS[id]}"></div>${providers[id].name}</div>`;
    }
    html += `</div></div>`;
  }

  // Steering action
  html += `<div class="setting-row"><span class="setting-label">While Streaming</span><div class="setting-value"><select onchange="savePref('steeringAction', this.value)"><option value="steer">Steer (redirect)</option><option value="queue">Queue</option><option value="stop">Stop & send</option></select></div></div>`;

  container.innerHTML = html;
}

function toggleConsensusProvider(id) {
  const idx = consensusProviders.indexOf(id);
  if (idx >= 0) {
    if (consensusProviders.length <= 2) return; // minimum 2
    consensusProviders.splice(idx, 1);
  } else {
    consensusProviders.push(id);
  }
  window.sassy.prefs.set('consensusProviders', consensusProviders);

  // Update chips
  document.querySelectorAll('.cp-chip').forEach(chip => {
    const p = chip.dataset.provider;
    chip.classList.toggle('selected', consensusProviders.includes(p));
  });
}

function switchMode(mode) {
  currentMode = mode;
  if (mode !== 'consensus') singleProvider = mode;
  buildModeBar();
}

function setSendMode(mode) { sendMode = mode; }

function setupListeners() {
  window.sassy.ai.removeChunkListeners();
  window.sassy.ai.removeDoneListeners();
  window.sassy.ai.onChunk(({ signal_id, provider, text }) => {
    if (!activeSignals.has(signal_id)) return;
    streamBuffers[signal_id] = (streamBuffers[signal_id] || '') + text;
    const el = document.getElementById(`stream-${signal_id}`);
    if (el) {
      el.innerHTML = renderMarkdown(streamBuffers[signal_id]) + '<span class="streaming-cursor"></span>';
      scrollToBottom();
    }
  });
  window.sassy.ai.onDone(({ signal_id, provider }) => {
    activeSignals.delete(signal_id);
    const el = document.getElementById(`stream-${signal_id}`);
    if (el) {
      el.innerHTML = renderMarkdown(streamBuffers[signal_id] || '');
    }
    setProviderStatus(provider, 'idle');
    if (activeSignals.size === 0) {
      isStreaming = false;
      updateSendButton();
      processQueue();
    }
  });
}

// ── Message rendering ──────────────────────────────────────────
function addUserMessage(text) {
  const area = document.getElementById('chat-area');
  area.insertAdjacentHTML('beforeend', `<div class="msg msg-user"><div class="msg-bubble">${escapeHtml(text)}</div></div>`);
  scrollToBottom();
}

function addSystemMessage(text) {
  const area = document.getElementById('chat-area');
  area.insertAdjacentHTML('beforeend', `<div class="msg msg-system"><div class="msg-bubble">${text}</div></div>`);
  scrollToBottom();
}

function createStreamingMessage(signal_id, provider) {
  const area = document.getElementById('chat-area');
  const pName = provider === 'consensus' ? 'Consensus' : (providers[provider]?.name || provider);
  const color = PROVIDER_COLORS[provider] || '#888';
  area.insertAdjacentHTML('beforeend', `
    <div class="msg msg-ai">
      <div class="msg-header"><div class="msg-provider-dot" style="background:${color}"></div>${pName}</div>
      <div class="msg-bubble" id="stream-${signal_id}"><span class="streaming-cursor"></span></div>
    </div>`);
  scrollToBottom();
}

function createDebatePanel() {
  const area = document.getElementById('chat-area');
  const cols = consensusProviders.map(id => `
    <div class="debate-col">
      <div class="debate-col-header" style="color:${PROVIDER_COLORS[id]}">${providers[id].name}</div>
      <div class="debate-col-text" id="debate-${id}-text">waiting...</div>
    </div>`).join('');

  area.insertAdjacentHTML('beforeend', `
    <div class="debate-panel" id="debate-active">
      <div class="debate-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
        <span style="color:var(--accent)">⚡</span>
        <span>Deliberating (${consensusProviders.length} providers)...</span>
      </div>
      <div class="debate-body">${cols}</div>
    </div>`);
  scrollToBottom();
  return document.getElementById('debate-active');
}

// ── Send handling ──────────────────────────────────────────────
function handleSend() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  autoResize(input);

  if (!isStreaming || sendMode === 'send') {
    sendMessage(text);
    return;
  }

  switch (sendMode) {
    case 'steer':
      addUserMessage(`↪ ${text}`);
      chatHistory.push({ role: 'user', content: `[STEERING] The user is redirecting: ${text}` });
      messageQueue.unshift(text);
      renderQueue();
      break;
    case 'stop':
      activeSignals.clear();
      isStreaming = false;
      streamBuffers = {};
      updateSendButton();
      sendMessage(text);
      break;
  }
}

async function sendMessage(text) {
  addUserMessage(text);
  chatHistory.push({ role: 'user', content: text });
  isStreaming = true;
  updateSendButton();

  if (currentMode === 'consensus' && consensusProviders.length >= 2) {
    await runConsensus(text);
  } else {
    const provider = currentMode === 'consensus' ? availableProviders[0] : currentMode;
    await runSingle(provider, text);
  }
}

// ── Single-provider streaming ──────────────────────────────────
async function runSingle(provider, text) {
  const sid = `s${++signalCounter}`;
  activeSignals.add(sid);
  streamBuffers[sid] = '';

  setProviderStatus(provider, 'streaming...');
  createStreamingMessage(sid, provider);

  const messages = chatHistory.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));
  const result = await window.sassy.ai.stream({ provider, messages, signal_id: sid });

  if (result.error) {
    addSystemMessage(`Error from ${providers[provider]?.name || provider}: ${result.error}`);
    activeSignals.delete(sid);
    isStreaming = false;
    setProviderStatus(provider, 'error');
    updateSendButton();
    return;
  }

  await waitForSignal(sid);
  if (streamBuffers[sid]) chatHistory.push({ role: 'assistant', content: streamBuffers[sid] });
}

// ── Consensus Engine ───────────────────────────────────────────
async function runConsensus(text) {
  const prefs = await window.sassy.prefs.get();
  const turns = prefs.consensusTurns || 2;
  const participants = consensusProviders;

  participants.forEach(p => setProviderStatus(p, 'deliberating...'));
  const debatePanel = createDebatePanel();

  const systemPrompt = `You are participating in a consensus-finding process with other AIs. Provide the most accurate, helpful, truthful response. After seeing other perspectives, refine your answer incorporating valid points while maintaining intellectual honesty. If you disagree on facts, explain why with evidence.`;

  // Round 1: All respond independently
  let responses = {};
  const r1Promises = participants.map(async (pid) => {
    const msgs = pid === 'anthropic'
      ? [{ role: 'user', content: text }]
      : [{ role: 'system', content: systemPrompt }, { role: 'user', content: text }];
    const res = await window.sassy.ai.complete({ provider: pid, messages: msgs });
    return { pid, text: res.text || res.error || '' };
  });

  const r1Results = await Promise.all(r1Promises);
  for (const r of r1Results) { responses[r.pid] = r.text; updateDebateText(r.pid, r.text); }

  // Deliberation rounds
  for (let round = 1; round < turns; round++) {
    updateDebateHeader(`Round ${round + 1}/${turns} — refining...`);

    const roundPromises = participants.map(async (pid) => {
      const otherResponses = participants.filter(p => p !== pid).map(p => `${providers[p].name}: "${responses[p]}"`).join('\n\n');
      const msgs = pid === 'anthropic'
        ? [
            { role: 'user', content: text },
            { role: 'assistant', content: responses[pid] },
            { role: 'user', content: `Other AIs responded:\n\n${otherResponses}\n\nRefine your answer, incorporating valid points. Produce a final, authoritative response.` }
          ]
        : [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: text },
            { role: 'assistant', content: responses[pid] },
            { role: 'user', content: `Other AIs responded:\n\n${otherResponses}\n\nRefine your answer, incorporating valid points. Produce a final, authoritative response.` }
          ];
      const res = await window.sassy.ai.complete({ provider: pid, messages: msgs });
      return { pid, text: res.text || responses[pid] };
    });

    const roundResults = await Promise.all(roundPromises);
    for (const r of roundResults) { responses[r.pid] = r.text; updateDebateText(r.pid, r.text); }
  }

  // Final synthesis
  updateDebateHeader('Synthesizing consensus...');

  const positionsList = participants.map(p => `${providers[p].name}:\n${responses[p]}`).join('\n\n---\n\n');

  const synthesisMessages = [{
    role: 'user',
    content: `Original question: "${text}"\n\n${positionsList}\n\nSynthesize all perspectives into a single, authoritative response. Where they agree, state consensus confidently. Where they differ, present both views with evidence strength. Be concise but thorough. Do NOT mention provider names — present unified truth.`
  }];

  // Pick strongest provider for synthesis (prefer anthropic)
  const synthesizer = participants.includes('anthropic') ? 'anthropic' : participants[0];
  const consSid = `cons${++signalCounter}`;
  activeSignals.add(consSid);
  streamBuffers[consSid] = '';

  debatePanel.querySelector('.debate-header').innerHTML = `<span style="color:var(--green)">✓</span><span>Deliberation complete (${turns} rounds, ${participants.length} providers)</span>`;

  createStreamingMessage(consSid, 'consensus');
  setProviderStatus(synthesizer, 'synthesizing...');

  await window.sassy.ai.stream({ provider: synthesizer, messages: synthesisMessages, signal_id: consSid });
  await waitForSignal(consSid);

  if (streamBuffers[consSid]) chatHistory.push({ role: 'assistant', content: streamBuffers[consSid] });

  participants.forEach(p => setProviderStatus(p, 'idle'));
  isStreaming = false;
  updateSendButton();
  processQueue();
}

// ── Helpers ────────────────────────────────────────────────────
function waitForSignal(sid) {
  return new Promise(resolve => {
    const check = setInterval(() => { if (!activeSignals.has(sid)) { clearInterval(check); resolve(); } }, 100);
  });
}

function updateDebateText(provider, text) {
  const el = document.getElementById(`debate-${provider}-text`);
  if (el) { el.textContent = text.length > 500 ? text.substring(0, 500) + '...' : text; el.parentElement.scrollTop = el.parentElement.scrollHeight; }
}

function updateDebateHeader(text) {
  const panel = document.getElementById('debate-active');
  if (panel) { const span = panel.querySelector('.debate-header span:last-child'); if (span) span.textContent = text; }
}

function renderQueue() {
  const area = document.getElementById('queue-area');
  area.innerHTML = messageQueue.map((msg, i) => `<div class="queue-item"><span class="queue-badge">Q${i + 1}</span><span class="queue-text">${escapeHtml(msg.substring(0, 60))}${msg.length > 60 ? '...' : ''}</span><button class="queue-remove" onclick="removeFromQueue(${i})">✕</button></div>`).join('');
}

function removeFromQueue(i) { messageQueue.splice(i, 1); renderQueue(); }
function processQueue() { if (messageQueue.length > 0 && !isStreaming) { const next = messageQueue.shift(); renderQueue(); sendMessage(next); } }

function setProviderStatus(provider, status) {
  const el = document.getElementById(`status-${provider}-text`);
  if (el) el.textContent = status;
}

function updateSendButton() {
  const btn = document.getElementById('btn-send');
  btn.textContent = isStreaming ? '⟳' : 'Send';
}

function toggleDropdown() { document.getElementById('dropdown-menu').classList.toggle('show'); }
function closeDropdown() { document.getElementById('dropdown-menu').classList.remove('show'); }
document.addEventListener('click', (e) => { if (!e.target.closest('.send-group')) closeDropdown(); });

function toggleSettings() { document.getElementById('settings-overlay').classList.toggle('show'); }
async function savePref(key, value) { await window.sassy.prefs.set(key, value); }

function newChat() {
  chatHistory = []; streamBuffers = {}; activeSignals.clear(); isStreaming = false; messageQueue = [];
  document.getElementById('chat-area').innerHTML = '';
  document.getElementById('queue-area').innerHTML = '';
  updateSendButton();
  addSystemMessage('New conversation started.');
}

function scrollToBottom() { const area = document.getElementById('chat-area'); area.scrollTop = area.scrollHeight; }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 200) + 'px'; }
function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

function renderMarkdown(text) {
  return text
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

init();
</script>

<script>
// ── Mesh / Dashboard / Phone / Actions views ───────────────────────
// Additive layer over the consensus chat. Talks to the SassyMCP coordination
// layer via window.sassy.mesh (IPC -> python CLIs). The chat above is untouched.
// Pure DOM construction (textContent only) — no markup injection.
let currentView = 'chat';
let viewPollTimer = null;

function h(tag, attrs, kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'onclick') e.onclick = v;
    else e.setAttribute(k, v);
  }
  if (kids) for (const c of [].concat(kids)) { if (c == null) continue; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }
  return e;
}
function _ago(sec) { if (sec == null || !isFinite(sec)) return '—'; if (sec < 60) return Math.round(sec) + 's'; if (sec < 3600) return Math.round(sec / 60) + 'm'; if (sec < 86400) return Math.round(sec / 3600) + 'h'; return Math.round(sec / 86400) + 'd'; }
function vpHead(title, onRefresh) { const k = [h('span', { class: 'vp-title', text: title })]; if (onRefresh) k.push(h('button', { class: 'vp-refresh', text: '↻ refresh', onclick: onRefresh })); return h('div', { class: 'vp-head' }, k); }
function card(title, kids) { return h('div', { class: 'vp-card' }, [h('h3', { text: title })].concat(kids)); }
function empty(t) { return h('div', { class: 'vp-empty', text: t }); }

function switchView(name) {
  currentView = name;
  document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  const chat = name === 'chat';
  document.getElementById('mode-bar').style.display = chat ? '' : 'none';
  document.getElementById('status-bar').style.display = chat ? '' : 'none';
  document.getElementById('chat-area').style.display = chat ? '' : 'none';
  document.getElementById('queue-area').style.display = chat ? '' : 'none';
  document.querySelector('.input-area').style.display = chat ? '' : 'none';
  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
  if (viewPollTimer) { clearInterval(viewPollTimer); viewPollTimer = null; }
  if (chat) return;
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'mesh') { loadMesh(); viewPollTimer = setInterval(loadMesh, 4000); }
  else if (name === 'dashboard') { loadDashboard(); }
  else if (name === 'phone') { loadPhone(); viewPollTimer = setInterval(loadPhone, 15000); }
  else if (name === 'actions') { loadActions(); }
}

function peerNode(p) {
  const caps = p.capabilities || [];
  const capWrap = h('div', { class: 'caps' }, caps.length ? caps.map(c => h('span', { class: 'cap', text: c })) : [h('span', { class: 'cap dim', text: 'no caps' })]);
  return h('div', { class: 'peer' }, [
    h('div', { class: 'peer-top' }, [h('span', { class: 'dot ' + (p.alive ? 'g' : 'x') }), h('span', { class: 'peer-name', text: p.name || p.peer_id }), h('span', { class: 'peer-plat', text: p.platform || '?' })]),
    capWrap,
    h('div', { class: 'peer-foot', text: _ago(p.age_seconds) + ' ago' })
  ]);
}
function channelRow(c, max) {
  const i = h('i'); i.style.width = ((c.count / max) * 100) + '%';
  return h('div', { class: 'chrow' }, [h('span', { style: 'flex:0 0 120px', text: c.channel }), h('span', { class: 'bar' }, [i]), h('span', { text: String(c.count) })]);
}
function handoffRow(hd) {
  return h('div', { class: 'chrow' }, [h('b', { text: hd.from || '?' }), ' → ', h('b', { text: hd.to || 'any' }), h('span', { style: 'color:var(--text2);flex:1', text: ' ' + (hd.task || '') }), h('span', { style: 'color:var(--text3)', text: (hd.channel || '') + ' · ' + _ago(hd.age_seconds) })]);
}
function statCard(l, v, s, accent) { return h('div', { class: 'vp-card' }, [h('h3', { text: l }), h('div', { class: 'stat-v' + (accent ? ' accent' : ''), text: String(v) }), h('div', { class: 'stat-s', text: s || '' })]); }
function actBtn(title, sub, onclick) { return h('button', { class: 'vp-act', onclick }, [h('b', { text: title }), h('span', { text: sub })]); }

async function loadMesh() {
  const el = document.getElementById('panel-mesh'); el.replaceChildren();
  const b = await window.sassy.mesh.board();
  if (b.error) { el.appendChild(vpHead('Mesh', loadMesh)); el.appendChild(card('Coordination', [empty(b.error)])); return; }
  const peers = b.peers || [], alive = peers.filter(p => p.alive).length;
  const chans = b.channels || [], max = Math.max(1, ...chans.map(c => c.count));
  const hs = b.handoffs || [];
  el.appendChild(vpHead('⚡ ' + alive + ' agent' + (alive === 1 ? '' : 's') + ' live · coordination mesh', loadMesh));
  el.appendChild(h('div', { class: 'vp-grid' }, [
    card('Agents', peers.length ? peers.map(peerNode) : [empty('No agents yet. Actions → Announce.')]),
    card('Channels', chans.length ? chans.map(c => channelRow(c, max)) : [empty('none')])
  ]));
  const tl = card('Handoff timeline', hs.length ? hs.map(handoffRow) : [empty('no handoffs yet')]);
  tl.style.marginTop = '12px';
  el.appendChild(tl);
}

async function loadDashboard() {
  const el = document.getElementById('panel-dashboard'); el.replaceChildren();
  const b = await window.sassy.mesh.brain();
  if (b.error) { el.appendChild(vpHead('Brain', loadDashboard)); el.appendChild(card('Brain state', [empty(b.error)])); return; }
  const tier = (b.tier || 'free').toUpperCase() + (b.addons && b.addons.length ? ' + ' + b.addons.join(', ') : '');
  el.appendChild(vpHead('Brain state', loadDashboard));
  el.appendChild(h('div', { class: 'vp-grid' }, [
    statCard('License tier', tier, b.license_valid ? (b.email || 'valid') : 'free', true),
    statCard('Memory entries', b.memory_count || 0, (b.milestones || 0) + ' milestones'),
    statCard('Audit log', b.audit_count || 0, 'tool calls recorded'),
    statCard('Persona', b.persona ? 'configured' : 'not set', b.persona ? 'loaded each session' : 'run setup'),
    statCard('Tool groups', (b.allowed_group_count || 0) + '/' + (b.group_count || 0), (b.module_allowed || 0) + '/' + (b.module_total || 0) + ' modules'),
    statCard('Version', 'v' + (b.version || '?'), b.home || '')
  ]));
}

async function loadPhone() {
  const el = document.getElementById('panel-phone'); el.replaceChildren();
  const b = await window.sassy.mesh.phone();
  const devices = (b && b.devices) || [];
  el.appendChild(vpHead(devices.length ? ('📱 ' + devices.length + ' device' + (devices.length === 1 ? '' : 's')) : 'Phone', loadPhone));
  if (!devices.length) { el.appendChild(card('Phone', [empty((b && b.error) ? b.error : 'No device connected. Plug in an Android with USB debugging enabled.')])); return; }
  el.appendChild(card('Connected', devices.map(d => h('div', { class: 'peer' }, [
    h('div', { class: 'peer-top' }, [h('span', { class: 'dot ' + (d.state === 'device' ? 'g' : 'x') }), h('span', { class: 'peer-name', text: d.model || d.serial }), h('span', { class: 'peer-plat', text: d.state || '' })]),
    h('div', { class: 'peer-foot', text: d.serial })
  ]))));
}

function loadActions() {
  const el = document.getElementById('panel-actions'); el.replaceChildren();
  el.appendChild(vpHead('Actions'));
  el.appendChild(h('div', { class: 'vp-actions' }, [
    actBtn('📣 Announce to mesh', 'register Sassy Brain + its active AIs as peers', doAnnounce),
    actBtn('📱 Scan for phone', 'find connected Android devices', () => switchView('phone')),
    actBtn('📂 Open ~/.sassymcp', 'the brain on disk (File Explorer)', () => window.sassy.mesh.openHome()),
    actBtn('↻ Refresh mesh', 'reload agents, channels, handoffs', () => switchView('mesh'))
  ]));
}

// "Talk together": register Sassy Brain and each key'd AI provider as peers so
// the consensus participants appear as coordinating agents in the mesh.
async function meshInit() {
  try {
    await window.sassy.mesh.announce({ id: 'sassy-brain', name: 'Sassy Brain', platform: 'desktop', caps: 'consensus,chat' });
    const has = await window.sassy.keys.has();
    const provs = await window.sassy.providers.list();
    for (const id of Object.keys(provs)) {
      if (has[id]) await window.sassy.mesh.announce({ id: 'ai-' + id, name: provs[id].name, platform: 'cloud-ai', caps: 'chat,consensus' });
    }
  } catch (e) { /* mesh optional — chat works without SassyMCP present */ }
}
async function doAnnounce() { await meshInit(); switchView('mesh'); }

meshInit();
</script>
